name: QuantFast CI/CD (Sprint 2)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: CI - Build Rust
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./QuantFast

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Test Docker Compose Build
          working-directory: ./QuantFast
          run: docker compose build

      - name: Cache Cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Check Formatting
        run: cargo fmt -- --check || echo "Skipping fmt strict check"

      - name: Build Project
        run: cargo build --verbose

 docker-delivery:
    name: CD - Docker Build
    needs: build-and-test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Docker tooling
        run: |
          docker --version
          docker compose version

      - name: Test Docker Compose Build
        working-directory: ./QuantFast
        run: docker compose build 
