version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 10s
      retries: 5

  quant_backend:
    build: 
      context: .
      dockerfile: Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      # Se precisar passar alguma env var de conexão pro Rust, coloque aqui
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/%2f
