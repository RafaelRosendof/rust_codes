[package]
name = "cli_quant"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
lapin = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
statrs = "0.18.0"

# CLI & Utilities
clap = { version = "4.4", features = ["derive"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
dotenvy = "0.15"

# Finance & Math
rand = "0.8"
rand_distr = "0.4"
rayon = "1.8"

# Data
# need the yahoo_finance
reqwest = { version = "0.11", features = ["json"]}